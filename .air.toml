root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
args_bin = []
bin = "./tmp/srv"
cmd = "make dev"
delay = 300
exclude_dir = ["tmp", "vendor", "testdata", "docker", "frontend"]
exclude_file = [
    "pkg/db/db.go",
    "pkg/db/batch.go",
    "pkg/db/models.go",
    "pkg/db/querier.go",
    "pkg/db/query.sql.go",
]
exclude_regex = ["_test.go"]
exclude_unchanged = false
follow_symlink = false
full_bin = ""
include_dir = []
include_ext = ["go", "sql", "json", "yaml"]
include_file = []
kill_delay = 10
log = "build-errors.log"
poll = false
poll_interval = 0
rerun = false
rerun_delay = 300
send_interrupt = false
stop_on_error = false

[color]
app = ""
build = "yellow"
main = "magenta"
runner = "green"
watcher = "cyan"

[log]
main_only = false
time = false

[misc]
clean_on_exit = false

[screen]
clear_on_rebuild = false
keep_scroll = true
