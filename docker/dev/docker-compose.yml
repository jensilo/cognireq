services:
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: cognireq-backend-dev
    user: "1000:1000"
    volumes:
      - ../..:/app
      - go-pkg:/go/pkg
      - go-cache:/go/cache
      - dot-cache:/.cache
      - /etc/passwd:/etc/passwd:ro
    environment:
      GOCACHE: /go/cache
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    image: node:22-alpine
    container_name: cognireq-frontend-dev
    working_dir: /app/frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ../../frontend:/app/frontend
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - VITE_API_BASE_URL=http://localhost:8080/api/v1
    depends_on:
      - backend

  db:
    build:
      context: .
      dockerfile: db.Dockerfile
    container_name: cognireq-db-dev
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cognireq
    volumes:
      - db-data:/var/lib/postgresql/data

  testdb:
    build:
      context: .
      dockerfile: db.Dockerfile
    container_name: cognireq-db-dev-test
    ports:
      - "6543:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cognireq
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d cognireq" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  go-pkg:
  go-cache:
  dot-cache:
  db-data: