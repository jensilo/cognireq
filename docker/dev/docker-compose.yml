services:
  backend:
    build:
      context: .
    container_name: harmony-backend-dev
    user: "1000:1000"
    volumes:
      - ../..:/app
      - go-pkg:/go/pkg
      - go-cache:/go/cache
      - dot-cache:/.cache
      - /etc/passwd:/etc/passwd:ro
    environment:
      GOCACHE: /go/cache
    ports:
      - "8080:8080"

  frontend:
    image: node:22-alpine
    container_name: harmony-frontend-dev
    working_dir: /app/frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ../../frontend:/app/frontend
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:8080/api
    depends_on:
      - backend

    # todo add PostgreSQL db

volumes:
  go-pkg:
  go-cache:
  dot-cache: