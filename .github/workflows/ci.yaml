name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24' # Specify the Go version for the runner

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod # Default GOMODCACHE on host
          key: ${{ runner.os }}-go-modules-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-modules-

      - name: Cache Go build cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build # Default GOCACHE on host
          key: ${{ runner.os }}-go-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-go-build-

      - name: Set up docker environment (testdb only)
        run: (cd docker/dev && docker compose up -d --wait testdb)

      - name: Verify Generated Code
        run: |
          if ! git diff --exit-code; then
            echo "Generated code is out of date. Please run 'sqlc generate' and 'go generate ./...' and commit the changes."
            exit 1
          fi

      - name: Run Go tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always() # always upload, even if tests fail
        with:
          name: coverage-report
          path: coverage.out